[project]
name = "indextts-gui2"
version = "1.0.0"
description = "AI语音合成任务管理桌面工具"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.6.0",
    "httpx>=0.27.0",
    "gradio-client>=1.0.0",
    "pyinstaller>=6.0.0",
]

[project.scripts]
indextts-gui = "src.main:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
]

[tool.uv]
package = true

[tool.pyinstaller]
name = "IndexTTS-GUI2"
onefile = true
windowed = true
icon = "src/resources/icon.ico"
