[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "indextts-gui2"
version = "1.0.0"
description = "AI语音合成任务管理桌面工具"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pyside6>=6.6.0",
    "httpx>=0.27.0",
    "gradio-client>=1.0.0",
    "requests>=2.32.0",
]

[project.scripts]
indextts-gui = "src.main:main"

[dependency-groups]
dev = [
    "pyinstaller>=6.0.0",
    "pytest>=8.0.0",
    "pytest-qt>=4.4.0",
]

[tool.setuptools]
packages = [
    "src",
    "src.core",
    "src.engines",
    "src.resources",
    "src.ui",
    "src.utils",
    "indextts_batch_gui",
    "indextts_batch_gui.ui",
]

[tool.setuptools.package-dir]
indextts_batch_gui = "src/indextts_batch_gui"
"indextts_batch_gui.ui" = "src/indextts_batch_gui/ui"

[tool.setuptools.package-data]
"src.resources" = ["*.qss"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true

[tool.pyinstaller]
name = "IndexTTS-GUI2"
onefile = true
windowed = true
icon = "src/resources/icon.ico"
